plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Подпись релиза: путь и пароль только в local.properties (не в git), сам ключ лежит у автора.
def local = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { local.load(it) }

android {
    namespace 'com.xgimiru.player'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xgimiru.player'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.9'
        // версия встроенного TorrServer (тег upstream), для экрана настроек
        buildConfigField 'String', 'TORRSERVER', "\"${rootProject.file('torrserver/VERSION').text.trim()}\""
    }
    buildFeatures { buildConfig true }

    // Встроенный торрент-движок: TorrServer, собранный torrserver/build.sh, едет в APK как
    // lib/<abi>/libtorrserver.so. Это программа, а не библиотека: запустить её можно только
    // распакованной в nativeLibraryDir, поэтому библиотеки в APK сжаты и распаковываются при
    // установке (extractNativeLibs="true").
    sourceSets.main.jniLibs.srcDirs += rootProject.file('torrserver/out/jniLibs')
    packaging { jniLibs { useLegacyPackaging true } }

    // Два APK вместо одного на 100 МБ: arm64-v8a (Z9X и всё 64-битное) и armeabi-v7a (32-битные
    // приставки и телевизоры). Код у них один, отличаются только библиотеки VLC и FFmpeg.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    signingConfigs {
        release {
            if (local['kino.storeFile']) {
                storeFile file(local['kino.storeFile'])
                storePassword local['kino.storePassword']
                keyAlias local['kino.keyAlias']
                keyPassword local['kino.keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (local['kino.storeFile']) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Сборка движка перед сборкой APK (пропускает, если ничего не менялось). Нужны Go и NDK;
// без них: gradle -Pkino.noTorrServer ... (APK без встроенного движка, работает только внешний TorrServe).
def buildTorrServer = tasks.register('buildTorrServer', Exec) {
    commandLine 'bash', rootProject.file('torrserver/build.sh').path
}
if (!project.hasProperty('kino.noTorrServer')) {
    tasks.named('preBuild') { dependsOn buildTorrServer }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    // Движок — libVLC: играет всё (AVI/XviD, DTS, ASS, …). Интерфейс — свой.
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    // Второй движок — только для Dolby Vision профиля 5: у чипа есть аппаратный
    // декодер DV, а VLC его не использует и показывает фиолетовую картинку.
    def media3 = '1.6.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2'
}
